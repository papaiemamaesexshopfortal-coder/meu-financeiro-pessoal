name: Build Android APK

on:
  push:
    branches: [main, 'release/hardening-20261013']
    paths:
      - 'index.html'
      - 'app.js'
      - 'cloud-sync.mjs'
      - 'file-export.mjs'
      - 'native-files.js'
      - 'vendor/**'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'api/**'
      - 'supabase/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Validate inline JavaScript syntax
        run: npm run build
      - name: Run security and sync tests
        run: npm test && npm run typecheck
      - name: Prepare web assets
        run: npm run copy:web
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply finance illustration as Android app icon
        run: node scripts/set-android-icon.js
      - name: Set Android version
        run: node scripts/configure-android-release.js
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meu-financeiro-pessoal-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
